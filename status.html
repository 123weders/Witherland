<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Статус — WitherLand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="buttons.css">
<link rel="stylesheet" href="status.css">
<script src="head.js" defer></script>
</head>
<body>
<header id="site-header"></header>
<main>
<div class="wrap">
<h1 class="page-title">Статус сервера</h1>
<div id="status-box" class="card status-card">
  <p><span class="status-dot"></span><span id="st-state">Загрузка...</span></p>
  <div class="stats">
    <div class="stat"><span>Игроки</span><b id="st-players">—</b></div>
    <div class="stat"><span>Версия</span><b id="st-version">—</b></div>
    <div class="stat"><span>IP</span><b class="server-ip">—</b></div>
  </div>
  <p id="st-motd" style="color:var(--muted)"></p>
  <h3 style="margin:14px 0 6px">Игроки онлайн</h3>
  <ul id="st-list"></ul>
  <button id="refresh" class="btn btn-small">Обновить</button>
  <button class="btn btn-small btn-outline" onclick="copyIP()">Скопировать IP</button>
</div>
<div class="status-modes"><h2 class="title" style="margin-top:30px">Режимы</h2><div class="modes"></div></div>
</div>
</main>
<footer id="site-footer"></footer>
</body>
</html>
